[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-lsantann"
version = "1.0.0"
description = "Reusable maze generation library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

[tool.setuptools.packages.find]
include = ["mazegen*"]